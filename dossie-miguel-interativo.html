<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111e">
<title>Dossiê Miguel — Homens de Verdade</title>
<style>
:root{
  --bg:#07111f;--bg2:#0e1b2d;--panel:#0c1828;--paper:#f4ecdf;--ink:#f7f3eb;
  --muted:#aeb9c8;--gold:#d7aa56;--gold2:#f1d596;--line:rgba(255,255,255,.11);
  --danger:#d97c6c;--ok:#7fbea1;--shadow:0 28px 90px rgba(0,0,0,.42)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 78% 12%,rgba(215,170,86,.12),transparent 28%),
    radial-gradient(circle at 15% 78%,rgba(52,92,142,.18),transparent 34%),
    linear-gradient(155deg,var(--bg),var(--bg2));
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.20;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:30px 30px
}
.shell{max-width:1180px;margin:0 auto;padding:18px 22px 84px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 14px;background:linear-gradient(180deg,rgba(7,17,31,.96),rgba(7,17,31,.72),transparent);backdrop-filter:blur(8px)}
.brand{font-size:.76rem;text-transform:uppercase;letter-spacing:.18em;font-weight:900;color:var(--gold2)}
.clock{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:900;border:1px solid rgba(215,170,86,.35);border-radius:999px;padding:8px 13px;background:rgba(0,0,0,.2)}
.actbar{display:flex;gap:7px;align-items:center;flex:1;max-width:430px;margin:0 18px}
.actdot{height:5px;flex:1;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.actdot span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.35s}
.scene{display:none}.scene.active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:rgba(9,20,35,.88);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(12px)}
.pad{padding:clamp(22px,4vw,44px)}
.hero-grid{display:grid;grid-template-columns:1.03fr .97fr;min-height:620px}
.hero-copy{padding:clamp(30px,5vw,58px);display:flex;flex-direction:column;justify-content:center}
.art{position:relative;min-height:390px;overflow:hidden;background:#0a1524}
.art svg{display:block;width:100%;height:100%;min-height:390px}
.art .caption{position:absolute;left:18px;bottom:18px;padding:8px 11px;border-radius:999px;background:rgba(5,13,24,.76);border:1px solid rgba(255,255,255,.12);color:#dce4ef;font-size:.78rem;letter-spacing:.06em}
.eyebrow{color:var(--gold2);font-size:.78rem;text-transform:uppercase;letter-spacing:.16em;font-weight:900;margin-bottom:12px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 16px;line-height:1.03}
h1{font-size:clamp(2.7rem,6vw,6rem)}
h2{font-size:clamp(2rem,4.4vw,4.35rem)}
h3{font-size:clamp(1.3rem,2.25vw,2.05rem)}
.lead{font-size:clamp(1.02rem,1.9vw,1.35rem);line-height:1.64;color:#d9e1eb;max-width:900px}
.story{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.12rem,2.1vw,1.5rem);line-height:1.72;color:#f4efe7}
.quote{margin:22px 0;padding:22px 26px;border-left:4px solid var(--gold);background:rgba(215,170,86,.075);font-family:Georgia,serif;font-size:clamp(1.22rem,2.4vw,1.85rem);line-height:1.45}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
button{font:inherit}
.primary,.ghost{
  border-radius:999px;padding:13px 20px;font-weight:900;cursor:pointer;transition:.2s
}
.primary{border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#19150d}
.ghost{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink)}
.primary:hover,.ghost:hover{transform:translateY(-1px)}
.primary:disabled{opacity:.42;cursor:not-allowed;transform:none}
.question{margin-top:25px;padding-top:22px;border-top:1px solid var(--line)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}
.option{position:relative;text-align:left;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.035);color:var(--ink);border-radius:17px;padding:17px 18px;min-height:94px;line-height:1.45;cursor:pointer;transition:.2s}
.option:hover{transform:translateY(-2px);border-color:rgba(215,170,86,.52);background:rgba(215,170,86,.06)}
.option.selected{border-color:var(--gold);background:rgba(215,170,86,.11);box-shadow:0 0 0 2px rgba(215,170,86,.08) inset}
.option small{display:block;color:#7f8b9a;margin-bottom:6px;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.registered{display:none;margin-top:22px;padding:20px;border-radius:16px;border:1px solid rgba(215,170,86,.25);background:rgba(215,170,86,.07)}
.registered.show{display:block;animation:fade .3s ease}
.tag{display:inline-block;font-size:.69rem;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#1c170e;background:var(--gold2);padding:6px 9px;border-radius:999px;margin-bottom:9px}
.timeline{display:grid;gap:10px;margin-top:22px}
.timeline-row{display:grid;grid-template-columns:92px 1fr;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}
.timeline-time{font-weight:900;color:var(--gold2)}
.timeline-select{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.timechip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);padding:10px 13px;border-radius:999px;cursor:pointer}
.timechip.selected{background:rgba(215,170,86,.14);border-color:var(--gold);color:var(--gold2)}
.dossier{background:var(--paper);color:#172230;border-radius:22px;padding:clamp(23px,4vw,40px);box-shadow:0 20px 60px rgba(0,0,0,.32);position:relative;overflow:hidden}
.dossier:before{content:"ARQUIVO CONFIDENCIAL";position:absolute;right:-44px;top:36px;transform:rotate(18deg);font-weight:900;letter-spacing:.15em;color:rgba(151,70,53,.18);font-size:1.05rem}
.dossier .eyebrow{color:#8a6424}.dossier h2,.dossier h3{color:#172230}.dossier p{line-height:1.62}
.stamps{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.stamp{border:1px solid #a98b58;color:#715526;padding:8px 10px;border-radius:8px;font-size:.8rem;font-weight:800;transform:rotate(-1deg)}
.role{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 11px;border-radius:999px;background:rgba(95,143,191,.1);border:1px solid rgba(95,143,191,.22);color:#cfe2f8;font-size:.8rem;font-weight:800}
.interrogate{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.qcard{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:16px;padding:17px;cursor:pointer;transition:.2s}
.qcard:hover{border-color:rgba(215,170,86,.5);transform:translateY(-2px)}
.answer{display:none;margin-top:10px;color:#e7edf4;line-height:1.55}.qcard.open .answer{display:block}.qcard.open{background:rgba(215,170,86,.07)}
.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.reveal-card{padding:20px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.reveal-card b{color:var(--gold2)}
.bible{display:grid;gap:12px;margin-top:18px}
.bible details{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);overflow:hidden}
.bible summary{cursor:pointer;padding:16px 18px;font-weight:900;color:var(--gold2)}
.bible .inside{padding:0 18px 18px;color:#dfe6ef;line-height:1.58}
.mirror{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:22px}
.mirror textarea{width:100%;min-height:100px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px;font:inherit;resize:vertical}
.note{color:var(--muted);font-size:.9rem;line-height:1.52}
.bigline{font-family:Georgia,serif;font-size:clamp(2rem,4.7vw,4.6rem);line-height:1.04;margin:22px 0}
.center{text-align:center}
.teacher-btn{position:fixed;right:18px;bottom:18px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid rgba(215,170,86,.36);background:rgba(6,15,28,.9);color:var(--gold2);font-weight:900;cursor:pointer;box-shadow:var(--shadow)}
.teacher-panel{display:none;position:fixed;right:70px;bottom:18px;z-index:50;width:min(430px,calc(100vw - 96px));max-height:65vh;overflow:auto;padding:18px;border-radius:18px;background:#0a1626;border:1px solid rgba(215,170,86,.34);box-shadow:var(--shadow)}
.teacher-panel.show{display:block}.teacher-panel h4{margin:0 0 9px;color:var(--gold2)}.teacher-panel p{margin:.3rem 0 .75rem;color:#d8e1eb;line-height:1.5}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr}.art{min-height:310px}.options,.reveal-grid,.mirror,.interrogate{grid-template-columns:1fr}.actbar{display:none}.timeline-row{grid-template-columns:72px 1fr}.shell{padding:12px 14px 76px}}
</style>
</head>

{act:1,time:"17h40",type:"cover",title:"DOSSIÊ MIGUEL",sub:"6 horas. Um homem. Uma sequência de decisões que parece normal até deixar de parecer.",art:"office",teacher:"Objetivo: criar suspense. Não apresente o tema como pornografia, emoção ou domínio próprio. Só diga: hoje vamos investigar uma noite da vida de Miguel."},
{act:1,time:"17h40",type:"story",title:"A reunião",art:"office",body:"Durante uma reunião de trabalho, o gestor aponta um problema em um projeto conduzido por Miguel e diz diante da equipe:",quote:"“Eu esperava uma condução melhor disso.”",extra:"Miguel responde: “Tudo bem. Vou corrigir.” Depois da reunião, um colega pergunta se ele está bem. Miguel diz: “Estou tranquilo. Isso não me afeta.”",teacher:"Pergunte apenas: o que sabemos de fato? Não aceite interpretações como fatos."},
{act:1,time:"18h05",type:"story",title:"No carro",art:"car",body:"No caminho para casa, a reunião começa a voltar à cabeça de Miguel.",quote:"“Ele fez isso para me diminuir.”<br>“Ninguém respeita o que eu faço.”<br>“Se eu não provar que sou bom, vão passar por cima de mim.”",extra:"O fato não mudou. A leitura interna mudou.",teacher:"Pergunte quais emoções podem nascer dessas frases, mas não dê a aula ainda."},
{act:1,time:"20h10",type:"story",title:"A casa ficou silenciosa",art:"home",body:"Miguel tinha combinado de encontrar alguns amigos. Cancela. Diz que está cansado. Em casa, pede mais comida do que normalmente pediria e começa a alternar entre vídeos, redes sociais e conteúdo aleatório.",quote:"“Todo mundo está avançando e eu estou ficando para trás.”",extra:"Uma hora passa. Depois duas.",teacher:"Pergunte apenas: o que ele está tentando conseguir agora? Deixe o grupo nomear alívio, distração, conforto, validação, controle."},
{act:1,time:"23h34",type:"story",title:"A negociação",art:"phone",body:"Continuando no celular, Miguel encontra conteúdo sensual. Fecha. Alguns minutos depois, volta.",quote:"“Só vou olhar.”<br>“Eu já estou mal mesmo.”<br>“É só hoje.”<br>“Amanhã eu recomeço.”",extra:"Ele termina consumindo pornografia. Às 00h17 fecha o celular e pensa: “Sou muito fraco. Deus deve estar cansado de mim.”",teacher:"Não dê solução. Só deixe o peso da cadeia aparecer."},

function art(kind){return '<div class="art">'+(artMap[kind]||artMap.office)+'<div class="caption">reconstituição visual do caso</div></div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));let t=a[i];a[i]=a[j];a[j]=t}return a}
function renderTop(){document.getElementById("clock").textContent=scenes[state.i].time;let act=scenes[state.i].act||1;let out="";for(let n=1;n<=5;n++)out+='<div class="actdot"><span style="width:'+(n<=act?'100':'0')+'%"></span></div>';document.getElementById("actbar").innerHTML=out}
function next(){if(state.i<scenes.length-1){state.i++;state.selected=null;render()}}
function selectOpt(n,el){state.selected=n;document.querySelectorAll(".option").forEach(function(b){b.classList.remove("selected")});el.classList.add("selected");document.getElementById("confirm").disabled=false}
function confirmChoice(){
 let s=scenes[state.i],o=s._opts[state.selected];
 state.trail.push({time:s.time,title:s.title,text:o[0],good:o[1],blind:o[2],tag:o[3]});
 document.querySelectorAll(".option").forEach(function(b){b.disabled=true});
 document.getElementById("confirm").disabled=true;
 let r=document.getElementById("registered");r.innerHTML='<span class="tag">DECISÃO REGISTRADA</span><h3>Sem análise por enquanto.</h3><p class="lead" style="font-size:1.03rem">O laudo só será aberto no final.</p><div class="actions"><button class="primary" onclick="next()">Continuar</button></div>';r.classList.add("show");
}
function selectTheory(t,el){if(state.firstTheory.indexOf(t)>=0){state.firstTheory=state.firstTheory.filter(function(x){return x!==t});el.classList.remove("selected")}else{state.firstTheory.push(t);el.classList.add("selected")}}
function openQ(el){if(!el.classList.contains("open")){el.classList.add("open");state.questionsOpened++}}
function countTags(){let c={};state.trail.forEach(function(x){c[x.tag]=(c[x.tag]||0)+1});return c}
function labelTag(t){return {performance:"desempenho/controle",avoidance:"adiamento/fuga",truth:"clareza/fato",validation:"validação",distraction:"distração",rumination:"ruminação",comfort:"conforto",comparison:"comparação",control:"controle",shame:"autocrítica/vergonha",masking:"aparência",isolation:"isolamento",honesty:"honestidade",regulation:"regulação",exposure:"exposição",negotiation:"negociação",boundary:"limite"}[t]||t}
function reportHTML(){
 let counts=countTags(),patterns=Object.entries(counts).sort(function(a,b){return b[1]-a[1]}).slice(0,4).map(function(x){return '<div class="reveal-card"><b>'+esc(labelTag(x[0]))+'</b><p>'+x[1]+' ocorrência'+(x[1]>1?'s':'')+' no caminho escolhido.</p></div>'}).join("");
 let trail=state.trail.map(function(x){return '<div class="dossier" style="margin-top:13px"><div class="eyebrow">'+esc(x.time)+' · '+esc(x.title)+'</div><h3>'+esc(x.text)+'</h3><p><strong>O que havia de legítimo:</strong> '+esc(x.good)+'</p><p><strong>O ponto cego possível:</strong> '+esc(x.blind)+'</p></div>'}).join("");
 let theory=state.firstTheory.length?state.firstTheory.join(", "):"nenhum ponto foi marcado";
 return '<section class="scene active card"><div class="pad"><div class="eyebrow">ATO 4 · O LAUDO</div><h2>Agora podemos interpretar o caminho.</h2><p class="lead">Até aqui, o sistema não disse se vocês acertaram ou erraram. Porque a atividade não tinha uma letra secreta. A pergunta sempre foi: <strong>o que aquela escolha estava tentando fazer pelo coração de Miguel?</strong></p><div class="quote">A mesma ação pode ser prudência, fuga, medo, humildade, controle ou maturidade — dependendo do que a governa.</div><h3>A hipótese inicial de vocês</h3><p class="lead" style="font-size:1.05rem">Pontos marcados como começo do problema: <strong>'+esc(theory)+'</strong>.</p><h3 style="margin-top:28px">Padrões que apareceram nas escolhas</h3><div class="reveal-grid">'+patterns+'</div><h3 style="margin-top:30px">O que estava escondido em cada decisão</h3>'+trail+'<div class="dossier" style="margin-top:22px"><div class="eyebrow">A LINHA DA AULA</div><h3>FATO → INTERPRETAÇÃO → EMOÇÃO → DESEJO → ROTA DE ALÍVIO → NEGOCIAÇÃO → ESCOLHA → FRUTO</h3><p><strong>Aula 2:</strong> fato não é interpretação. <strong>Aula 3:</strong> quando obedecer custa, quem governa? <strong>Aulas 4 e 5:</strong> desejo e emoção podem ser reais sem receber o trono.</p></div><div class="bible"><details><summary>Tiago 1:14–15 · Onde o processo começa?</summary><div class="inside">O texto descreve desejo, atração, desenvolvimento e fruto. A pergunta não é apenas “qual foi o ato final?”, mas como o processo foi alimentado.</div></details><details><summary>1 Coríntios 6:12 · Qual palavra muda a discussão?</summary><div class="inside"><strong>Dominar.</strong> A pergunta cristã não é apenas “isso é permitido?”, mas “isso começou a me governar?”.</div></details><details><summary>Efésios 4:26–27 · Raiva e pecado são a mesma coisa?</summary><div class="inside">Não automaticamente. A emoção é real; a responsabilidade aparece no que fazemos com ela, no que alimentamos e no espaço que damos a ela.</div></details><details><summary>Gálatas 5:16,22–25 · Domínio próprio é força de vontade?</summary><div class="inside">Não apenas. É fruto de uma vida que aprende a andar no Espírito — e isso se torna concreto em verdade, decisões, limites, práticas e comunidade.</div></details></div><div class="quote">Liberdade não é poder fazer tudo o que desejo. É não precisar obedecer a tudo o que desejo.</div><div class="actions"><button class="primary" onclick="next()">Reescrever a noite</button></div></div></section>';
}
function render(){
 renderTop();let s=scenes[state.i];document.getElementById("teacherText").innerHTML='<strong>'+esc(s.title)+'</strong><br>'+esc(s.teacher||"");
 let A=document.getElementById("app");
 if(s.type==="cover"){
  A.innerHTML='<section class="scene active card hero-grid"><div class="hero-copy"><div class="eyebrow">HOMENS DE VERDADE · EXPERIÊNCIA INTERATIVA</div><h1>'+s.title+'</h1><p class="lead">'+s.sub+'</p><div class="quote">Vocês não precisam descobrir a resposta certa. Precisam descobrir o que realmente fariam.</div><div class="actions"><button class="primary" onclick="next()">Abrir o dossiê</button></div></div>'+art(s.art)+'</section>';
 } else if(s.type==="story"){
  A.innerHTML='<section class="scene active card hero-grid"><div class="hero-copy"><div class="eyebrow">ATO '+s.act+' · '+esc(s.time)+'</div><h2>'+s.title+'</h2><div class="story"><p>'+s.body+'</p></div><div class="quote">'+s.quote+'</div><p class="lead" style="font-size:1.05rem">'+s.extra+'</p><div class="actions"><button class="primary" onclick="next()">Continuar</button></div></div>'+art(s.art)+'</section>';
 } else if(s.type==="crime"){
  let times=["17h40","18h05","20h10","23h34","00h17"];
  A.innerHTML='<section class="scene active card"><div class="pad"><div class="eyebrow">ATO 2 · CENA DO CRIME</div><h2>'+s.title+'</h2><p class="lead">Cada homem diga onde acha que o problema realmente começou. Marquem os pontos citados. Não vamos corrigir agora.</p><div class="timeline">'+times.map(function(t,i){return '<div class="timeline-row"><div class="timeline-time">'+t+'</div><div>'+["Crítica pública","Interpretação no carro","Isolamento e busca de alívio","Negociação","Fruto visível"][i]+'</div></div>'}).join("")+'</div><div class="timeline-select">'+times.map(function(t){return '<button class="timechip" onclick="selectTheory(\''+t+'\',this)">'+t+'</button>'}).join("")+'</div><div class="actions"><button class="primary" onclick="next()">Voltar para 17h40</button></div></div></section>';
 } else if(s.type==="choice"){
  s._opts=shuffle(s.opts);let who=((s.role-1)%3)+1;
  A.innerHTML='<section class="scene active card hero-grid"><div class="hero-copy"><div class="role">Vez do investigador '+who+' decidir</div><div class="eyebrow">ATO '+s.act+' · '+esc(s.time)+'</div><h2>'+s.title+'</h2><p class="lead">'+s.body+'</p><div class="question"><h3>'+s.q+'</h3><p class="note">Escolham a reação mais realista. A análise só aparece no final.</p><div class="options">'+s._opts.map(function(o,i){return '<button class="option" onclick="selectOpt('+i+',this)"><small>'+String.fromCharCode(65+i)+'</small>'+esc(o[0])+'</button>'}).join("")+'</div></div><div class="actions"><button class="primary" id="confirm" onclick="confirmChoice()" disabled>Registrar decisão</button></div><div id="registered" class="registered"></div></div>'+art(s.art)+'</section>';
 } else if(s.type==="unlock"){
  A.innerHTML='<section class="scene active dossier"><div class="eyebrow">ATO 3 · NOVA EVIDÊNCIA</div><h2>'+s.title+'</h2><div class="stamps"><span class="stamp">SONO: RUIM</span><span class="stamp">PRESSÃO: ALTA</span><span class="stamp">ISOLAMENTO: CRESCENTE</span></div><p>Miguel vinha dormindo mal havia semanas.</p><p>Seu pai sempre valorizou muito desempenho. Na infância, ele ouviu repetidamente: <strong>“Você consegue fazer melhor.”</strong></p><p>Nos últimos meses, Miguel começou a sentir solidão ao ver amigos avançando em casamento, carreira e projetos pessoais.</p><p>Há semanas não tem uma conversa realmente profunda com ninguém.</p><div class="quote" style="color:#172230;border-color:#8a6424;background:rgba(138,100,36,.08)">Isso muda a forma como vocês enxergam Miguel?</div><p><strong>Não respondam ainda se isso diminui ou aumenta a responsabilidade. Apenas guardem a nova evidência.</strong></p><div class="actions"><button class="primary" onclick="next()">Continuar investigação</button></div></section>';
 } else if(s.type==="interrogate"){
  let qs=[
   ["O que mais doeu na fala do seu chefe?","“Não foi só a crítica. Foi a sensação de que todo mundo viu que talvez eu não seja tão bom quanto pensam.”"],
   ["O que você queria sentir quando chegou em casa?","“Eu acho que eu queria parar de sentir. Só isso.”"],
   ["Por que você não falou com ninguém?","“Porque eu nem sabia explicar. E também não queria parecer fraco ou dramático.”"],
   ["Se a pornografia não tivesse aparecido, a noite estaria resolvida?","“Não. Eu ainda estaria com raiva, me comparando e tentando provar alguma coisa.”"]
  ];
  A.innerHTML='<section class="scene active card"><div class="pad"><div class="eyebrow">ATO 3 · 22h08</div><h2>'+s.title+'</h2><p class="lead">Cada homem escolhe uma pergunta. Abram até três respostas. Vocês ainda não recebem o laudo.</p><div class="interrogate">'+qs.map(function(q){return '<div class="qcard" onclick="openQ(this)"><strong>'+q[0]+'</strong><div class="answer">'+q[1]+'</div></div>'}).join("")+'</div><div class="actions"><button class="primary" onclick="next()">Fechar interrogatório</button></div></div></section>';
 } else if(s.type==="report"){
  A.innerHTML=reportHTML();
 } else if(s.type==="rewrite"){
  A.innerHTML='<section class="scene active card"><div class="pad"><div class="eyebrow">ATO 4 · SEGUNDA CHANCE</div><h2>'+s.title+'</h2><p class="lead">Agora vocês conhecem a história, os pontos cegos e os textos. Desta vez não haverá alternativas.</p><div class="timeline"><div class="timeline-row"><div class="timeline-time">17h40</div><div><strong>Após a crítica:</strong> o que uma resposta madura faria primeiro?</div></div><div class="timeline-row"><div class="timeline-time">18h05</div><div><strong>No carro:</strong> como separar fato, interpretação e emoção?</div></div><div class="timeline-row"><div class="timeline-time">20h10</div><div><strong>Na vulnerabilidade:</strong> qual limite ou conversa mudaria o terreno?</div></div><div class="timeline-row"><div class="timeline-time">23h34</div><div><strong>Na tentação:</strong> o que significa não negociar com o que domina?</div></div></div><div class="quote">Espírito → verdade → decisão → limite → prática → comunidade.</div><p class="lead">Não procurem uma noite perfeita. Construam uma noite em que Miguel ainda sente, ainda deseja e ainda enfrenta problemas — mas não entrega o governo.</p><div class="actions"><button class="primary" onclick="next()">Encerrar o caso Miguel</button></div></div></section>';
 } else if(s.type==="mirror"){
  A.innerHTML='<section class="scene active card hero-grid"><div class="hero-copy center"><div class="eyebrow">ATO 5 · O ESPELHO</div><h1>'+s.title+'</h1><p class="lead">Foi mais fácil enxergar os pontos cegos dele. Agora a investigação muda de nome.</p><div class="bigline">O que grita dentro de você não precisa governar você.</div><div class="mirror" style="text-align:left"><div><label>Quando sou pressionado, qual história minha mente costuma contar?</label><textarea></textarea></div><div><label>Quando estou vulnerável, para onde costumo correr?</label><textarea></textarea></div><div><label>Que comportamento meu parece normal por fora, mas pode estar exercendo domínio?</label><textarea></textarea></div><div><label>Que limite preciso decidir antes da próxima pressão?</label><textarea></textarea></div></div><p class="note">Nada é enviado ou salvo.</p><div class="quote">“Andai no Espírito.” — Gálatas 5:16</div></div>'+art("home")+'</section>';
 }
 window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("teacherBtn").onclick=function(){document.getElementById("teacherPanel").classList.toggle("show")};
document.addEventListener("keydown",function(e){if(e.key.toLowerCase()==="p"&&!["TEXTAREA","INPUT"].includes(document.activeElement.tagName))document.getElementById("teacherPanel").classList.toggle("show")});
render();
</script>
