<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Dossiê Miguel — Quando Algo Grita por Dentro</title>
<style>
:root{--bg:#07111f;--bg2:#101c2d;--paper:#f5efe4;--gold:#d7a953;--gold2:#f0d394;--ink:#f7f3ea;--muted:#aeb9c8;--line:rgba(255,255,255,.12);--card:rgba(10,21,36,.88);--shadow:0 24px 80px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 78% 18%,rgba(215,169,83,.10),transparent 28%),radial-gradient(circle at 18% 75%,rgba(58,104,164,.14),transparent 34%),linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:28px 28px}
.shell{max-width:1180px;margin:0 auto;padding:24px 24px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{letter-spacing:.18em;text-transform:uppercase;font-weight:800;font-size:.78rem;color:var(--gold2)}.clock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold2);border:1px solid rgba(215,169,83,.35);padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.18)}
.progress{height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:28px}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s ease}
.scene{display:none;animation:fade .45s ease}.scene.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--gold2);text-transform:uppercase;letter-spacing:.15em;font-weight:800;font-size:.8rem;margin-bottom:12px}h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 16px;line-height:1.02}h1{font-size:clamp(2.7rem,6vw,6.2rem);max-width:980px}h2{font-size:clamp(2rem,4.2vw,4.5rem);max-width:1000px}h3{font-size:clamp(1.35rem,2.4vw,2.2rem)}.lead{font-size:clamp(1.05rem,2vw,1.45rem);line-height:1.65;color:#d9e0e9;max-width:930px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,42px);box-shadow:var(--shadow);backdrop-filter:blur(12px)}.story{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.15rem,2.2vw,1.55rem);line-height:1.7;color:#f5f1e9}.quote{margin:22px 0;padding:24px 28px;border-left:4px solid var(--gold);background:rgba(215,169,83,.07);font-family:Georgia,serif;font-size:clamp(1.25rem,2.6vw,2rem);line-height:1.45}
.question{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.option{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.035);color:var(--ink);text-align:left;padding:18px;border-radius:16px;font-size:1rem;line-height:1.45;cursor:pointer;transition:.2s ease;min-height:92px}.option:hover{transform:translateY(-2px);border-color:rgba(215,169,83,.55);background:rgba(215,169,83,.07)}.option.selected{border-color:var(--gold);background:rgba(215,169,83,.12);box-shadow:0 0 0 2px rgba(215,169,83,.10) inset}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button.primary,button.secondary{border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;font-size:.95rem}button.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b170e}button.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink)}button:disabled{opacity:.42;cursor:not-allowed}
.reveal{display:none;margin-top:24px;padding:24px;border-radius:18px;background:linear-gradient(145deg,rgba(215,169,83,.11),rgba(255,255,255,.03));border:1px solid rgba(215,169,83,.25)}.reveal.show{display:block;animation:fade .4s ease}.reveal .tag{display:inline-block;color:#1b170e;background:var(--gold2);font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:900;padding:6px 9px;border-radius:999px;margin-bottom:10px}
.evidence{margin-top:26px;padding:26px;border-radius:20px;background:var(--paper);color:#162132}.evidence .eyebrow{color:#8b6625}.evidence h3{color:#111b2a}.evidence p{font-size:1.05rem;line-height:1.6}.timeline{display:grid;gap:12px;margin:24px 0}.timeline .item{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}.timeline .time{font-weight:900;color:var(--gold2)}.choiceTrail{font-size:.98rem;color:#dbe1ea;line-height:1.55}
.lens{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.lens>div{padding:16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.lens b{display:block;color:var(--gold2);margin-bottom:6px}
.reflection{display:grid;gap:14px;margin-top:24px}.reflection label{font-weight:700;color:var(--gold2)}.reflection textarea{width:100%;min-height:92px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);padding:14px;font:inherit;resize:vertical}.note{color:var(--muted);font-size:.9rem;line-height:1.5}.warning{padding:18px;border-left:4px solid var(--gold);background:rgba(215,169,83,.07);margin-top:18px}.bigline{font-family:Georgia,serif;font-size:clamp(1.9rem,4vw,4rem);line-height:1.08;margin:22px 0}.center{text-align:center}
.teacher-btn{position:fixed;right:18px;bottom:18px;z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid rgba(215,169,83,.35);background:rgba(6,15,28,.88);color:var(--gold2);font-weight:900;cursor:pointer;box-shadow:var(--shadow)}.teacher-panel{display:none;position:fixed;right:72px;bottom:18px;z-index:50;width:min(430px,calc(100vw - 100px));max-height:62vh;overflow:auto;padding:18px;border-radius:18px;background:#0a1626;border:1px solid rgba(215,169,83,.35);box-shadow:var(--shadow)}.teacher-panel.show{display:block}.teacher-panel h4{margin:0 0 8px;color:var(--gold2)}.teacher-panel p{margin:.35rem 0 .8rem;color:#d8e0eb;line-height:1.5}
@media(max-width:760px){.options{grid-template-columns:1fr}.lens{grid-template-columns:1fr 1fr}.timeline .item{grid-template-columns:72px 1fr}.shell{padding:16px 16px 72px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand">Homens de Verdade · Experiência Interativa</div><div class="clock" id="clock">17h40</div></header>
<div class="progress"><span id="progressBar"></span></div>
<main id="app"></main>
</div>
<button class="teacher-btn" id="teacherBtn" title="Notas do facilitador">P</button>
<div class="teacher-panel" id="teacherPanel"><h4>Notas do facilitador</h4><p id="teacherText"></p></div>
<script>
const scenes=[{"time":"17h40","type":"story","eyebrow":"ABERTURA","title":"DOSSIÊ MIGUEL","body":"<p>Miguel tem 30 anos. É cristão desde a adolescência, serve na igreja, trabalha bem e costuma ser visto como alguém responsável.</p><p>Hoje vocês não vão assistir a uma aula. Vão <strong>investigar um homem</strong>. A história será revelada aos poucos.</p>","quote":"No final, a pergunta não será apenas “o que Miguel fez?”, mas “o que estava governando Miguel?”","teacher":"Não explique Aula 4 e 5 aqui. Apenas estabeleça as regras: não diagnosticar rápido, não chamar toda emoção de pecado e não antecipar a leitura bíblica."},{"time":"17h40","type":"story","eyebrow":"DOSSIÊ 01","title":"A reunião","body":"<p>Durante uma reunião de trabalho, o gestor aponta um problema em um projeto conduzido por Miguel e diz diante da equipe:</p>","quote":"“Eu esperava uma condução melhor disso.”","extra":"<p>Miguel responde: “Tudo bem. Vou corrigir.” Depois da reunião, um colega pergunta se ele está bem.</p><div class=\"quote\">“Estou tranquilo. Isso não me afeta.”</div>","teacher":"Pergunte apenas: “O que sabemos?”. Se disserem “foi humilhado” ou “ficou com raiva”, pergunte: fato ou interpretação?"},{"time":"18h05","type":"story","eyebrow":"DOSSIÊ 02","title":"O que aconteceu por dentro","body":"<p>No carro, Miguel repassa a reunião mentalmente.</p>","quote":"“Ele fez isso para me diminuir.”<br>“Ninguém respeita o que eu faço.”<br>“Se eu não provar que sou bom, vão passar por cima de mim.”","extra":"<div class=\"warning\"><strong>Agora a investigação muda.</strong><br>O fato continuou o mesmo. O significado atribuído ao fato mudou.</div>","teacher":"Pergunte quais emoções poderiam aparecer. Ainda não ensine a cadeia completa."},{"time":"20h10","type":"story","eyebrow":"DOSSIÊ 03","title":"A tentativa de aliviar","body":"<p>Miguel tinha combinado de encontrar alguns amigos. Cancela. Diz que está cansado.</p><p>Chega em casa, pede mais comida do que normalmente pediria e começa a alternar entre vídeos, redes sociais e conteúdo aleatório.</p>","quote":"“Todo mundo está avançando e eu estou ficando para trás.”","extra":"<p>Uma hora passa. Depois duas. O problema do trabalho não foi resolvido. A sensação dentro dele também não.</p>","teacher":"Pergunte: “O que ele está tentando conseguir?”. Deixe surgirem alívio, distração, conforto, validação, controle."},{"time":"23h34","type":"story","eyebrow":"DOSSIÊ 04","title":"A negociação","body":"<p>Continuando no celular, Miguel encontra conteúdo sensual. Fecha. Alguns minutos depois, volta.</p>","quote":"“Só vou olhar.”<br>“Eu já estou mal mesmo.”<br>“É só hoje.”<br>“Amanhã eu recomeço.”","extra":"<p>Ele termina consumindo pornografia. Às 00h17 fecha o celular e pensa: “Sou muito fraco. Deus deve estar cansado de mim.”</p>","teacher":"Deixe-os discutir onde começou a queda. Não revele ainda a resposta do curso."},{"time":"00h17","type":"story","eyebrow":"ANTES DE VOLTAR NO TEMPO","title":"Vocês já sabem como essa noite terminou.","body":"<p>Agora a investigação muda de direção.</p><p>Vocês voltarão para 17h40 e tomarão decisões por Miguel. Não respondam o que <em>parece</em> mais correto. Escolham o que vocês realmente acham que uma pessoa como vocês faria naquela situação.</p>","quote":"Não existe alternativa marcada como espiritual, madura ou bíblica. A leitura das escolhas só será revelada no final.","teacher":"Aqui diga: “Não tentem vencer o sistema. Quero a reação mais realista de vocês.”"},{"time":"17h42","type":"choice","eyebrow":"DECISÃO 01","title":"Dois minutos depois","body":"<p>Miguel saiu da reunião. Ainda tem quase duas horas de expediente.</p>","question":"Sem pensar no que seria ideal: o que ele faz agora?","options":[{"t":"Volta para a mesa, abre o projeto e começa a corrigir o que der imediatamente.","good":"É uma resposta funcional e pode demonstrar responsabilidade.","blind":"Também pode transformar desempenho em anestesia: “se eu consertar rápido, recupero meu valor”.","tags":["performance","avoidance"]},{"t":"Vai buscar água ou café e fica alguns minutos sozinho antes de voltar ao trabalho.","good":"Criar alguns minutos de distância pode reduzir reação impulsiva.","blind":"A pausa ajuda, mas pode virar apenas adiamento se ele não voltar ao que realmente aconteceu dentro dele.","tags":["regulation","avoidance"]},{"t":"Manda ao gestor: “Quando puder, queria entender melhor o ponto que você trouxe.”","good":"Procura informação antes de consolidar sua própria versão do episódio.","blind":"Mesmo uma conversa objetiva pode ser usada para se justificar, dependendo do que Miguel procura nela.","tags":["truth","clarification"]},{"t":"Manda para um colega: “Você também achou desnecessário o jeito que ele falou comigo?”","good":"Miguel tenta checar sua percepção com outra pessoa.","blind":"A pergunta já conduz o colega para a conclusão de Miguel e pode buscar validação em vez de verdade.","tags":["validation","rumination"]}],"teacher":"Não comente nenhuma alternativa. Apenas peça que defendam a escolha e clique."},{"time":"18h18","type":"choice","eyebrow":"DECISÃO 02","title":"No caminho para casa","body":"<p>A reunião continua voltando à cabeça. Miguel percebe que está irritado.</p>","question":"Qual reação parece mais parecida com o que ele realmente faria?","options":[{"t":"Coloca música ou um podcast e tenta parar de pensar no assunto por enquanto.","good":"Pode reduzir a intensidade e impedir ruminação imediata.","blind":"Também pode servir apenas para empurrar a emoção para depois, sem nomeá-la.","tags":["distraction","regulation"]},{"t":"Repete mentalmente a reunião e monta o que gostaria de ter respondido na hora.","good":"Ele tenta organizar o episódio e recuperar senso de controle.","blind":"Repetir a cena pode fortalecer a interpretação e alimentar a raiva mais do que esclarecer o fato.","tags":["rumination","control"]},{"t":"Manda áudio para alguém próximo: “Dia péssimo. Depois te conto. Acho que meu chefe passou do ponto.”","good":"Ele abre uma porta para não atravessar a noite completamente sozinho.","blind":"A frase já entrega uma conclusão antes que ele tenha separado fato de interpretação.","tags":["connection","validation"]},{"t":"Para em algum lugar, toma um café, come alguma coisa e depois segue para casa.","good":"Uma pausa concreta pode ajudar o corpo a sair do modo de tensão.","blind":"Também pode inaugurar a lógica de regular desconforto com consumo sem perceber.","tags":["comfort","regulation"]}],"teacher":"Ainda não interprete. Se perguntarem qual é a certa, responda: “Só no final vamos abrir o laudo.”"},{"time":"20h05","type":"choice","eyebrow":"DECISÃO 03","title":"O compromisso da noite","body":"<p>Miguel tinha marcado de encontrar três amigos. Está cansado e sem muita vontade de conversar.</p>","question":"O que ele provavelmente faria?","options":[{"t":"Vai mesmo assim e tenta agir normalmente para ver se melhora com o tempo.","good":"Ele preserva o compromisso e evita ficar completamente sozinho.","blind":"Pode estar cercado de gente e continuar emocionalmente escondido.","tags":["connection","masking"]},{"t":"Cancela e diz que está muito cansado. Prefere ficar quieto em casa.","good":"Descanso pode ser legítimo quando o corpo e a mente estão sobrecarregados.","blind":"“Preciso ficar sozinho” também pode ser a forma mais confortável de evitar ser visto.","tags":["isolation","rest"]},{"t":"Vai, fica menos tempo que o normal e volta cedo para casa.","good":"É uma tentativa de equilibrar convivência e necessidade de descanso.","blind":"Pode cumprir presença sem permitir nenhuma conversa real sobre o que está acontecendo.","tags":["connection","masking"]},{"t":"Antes de decidir, manda para um deles: “Hoje estou meio estranho. Vocês vão ficar até que horas?”","good":"Ele sinaliza que não está completamente bem sem transformar tudo numa confissão imediata.","blind":"A mensagem cria uma abertura; ainda não sabemos se Miguel vai usá-la ou recuar.","tags":["connection","honesty"]}],"teacher":"O ponto escondido é presença física versus ser conhecido. Não revele agora."},{"time":"21h22","type":"choice","eyebrow":"DECISÃO 04","title":"Finalmente em casa","body":"<p>O apartamento está silencioso. Miguel ainda pensa no trabalho e na comparação com outras pessoas.</p>","question":"O que ele faz primeiro?","options":[{"t":"Abre o notebook e adianta parte do trabalho para chegar na segunda com tudo sob controle.","good":"É produtivo e pode realmente reduzir pendências.","blind":"Também pode transformar desempenho em tentativa de recuperar valor e controle.","tags":["performance","control"]},{"t":"Pede comida, escolhe uma série e decide que amanhã pensa melhor nisso.","good":"Descanso e lazer não são problemas por si mesmos.","blind":"A pergunta é se ele está descansando ou pedindo que entretenimento e comida façam o desconforto desaparecer.","tags":["comfort","avoidance"]},{"t":"Deita no sofá e começa a passar vídeos curtos sem escolher nada específico.","good":"É uma resposta extremamente comum quando alguém está cansado e quer descompressão.","blind":"A ausência de intenção pode deixá-lo exposto a horas de estímulo, comparação e busca de alívio.","tags":["distraction","avoidance"]},{"t":"Toma banho, fica um tempo sem tela e depois decide o que fará com o resto da noite.","good":"Muda o estado físico e cria espaço antes da próxima decisão.","blind":"Isso melhora a condição de escolha, mas não resolve sozinho raiva, interpretação, solidão ou desejo.","tags":["regulation","pause"]}],"teacher":"Não moralize comida, série, trabalho ou celular. Só registre."},{"time":"23h31","type":"choice","eyebrow":"DECISÃO 05","title":"Um conteúdo aparece","body":"<p>Miguel está no celular e surge uma sequência de imagens sensuais. Ele sente curiosidade e percebe que está mais vulnerável do que gostaria de admitir.</p>","question":"Qual reação parece mais realista?","options":[{"t":"Passa rapidamente para o próximo conteúdo e continua no mesmo aplicativo.","good":"Ele não decide conscientemente permanecer naquele conteúdo.","blind":"O ambiente, o acesso e o estado interno continuam exatamente iguais.","tags":["exposure","avoidance"]},{"t":"Fecha o aplicativo e abre outro para distrair a cabeça.","good":"Ele rompe o contato imediato com o estímulo.","blind":"Troca de aplicativo pode ser apenas troca de estímulo, mantendo a mesma busca de anestesia.","tags":["distraction","exposure"]},{"t":"Fica alguns segundos olhando, fecha e diz para si mesmo que não vai voltar.","good":"Ele ainda coloca um limite antes de avançar mais.","blind":"A negociação já começou: “só alguns segundos” pode normalizar ficar perto do limite para testar controle.","tags":["negotiation","control"]},{"t":"Coloca o celular virado para baixo, levanta e vai fazer outra coisa em outro cômodo.","good":"Muda ambiente e interrompe o automatismo antes de decidir novamente.","blind":"A mudança ajuda, mas não explica nem trata tudo o que trouxe Miguel até esse ponto.","tags":["boundary","regulation"]}],"teacher":"Aqui eles tendem a procurar a alternativa certa. Reforce: “qual seria mais realista, não qual soa melhor?”"},{"time":"08h20","type":"choice","eyebrow":"DECISÃO 06","title":"Na manhã seguinte","body":"<p>Independentemente de como a noite terminou, Miguel acorda incomodado com a sequência das últimas horas.</p>","question":"Qual seria a primeira coisa que ele tentaria mudar?","options":[{"t":"Organiza uma rotina mais rígida para a próxima semana: trabalho, treino, sono e menos tempo livre.","good":"Estrutura pode reduzir vulnerabilidades reais e melhorar sono e rotina.","blind":"Rotina forte não resolve automaticamente necessidade de aprovação, raiva ou isolamento.","tags":["structure","performance"]},{"t":"Configura limites no celular e decide não levá-lo para a cama à noite.","good":"Mexe em acesso e ambiente, onde várias decisões ruins ganharam força.","blind":"Barreira externa é valiosa, mas pode ser contornada se a necessidade de alívio continuar intocada.","tags":["boundary","structure"]},{"t":"Resolve conversar com o gestor na segunda para fechar a questão do trabalho.","good":"Enfrenta o conflito que disparou parte da cadeia e busca clareza.","blind":"Resolver o trabalho não resolve automaticamente o modo como Miguel lida com emoções e desejos.","tags":["truth","clarification"]},{"t":"Manda uma mensagem para um amigo dizendo: “Ontem eu não estava bem. Depois quero te contar uma coisa.”","good":"Rompe parte do isolamento e cria possibilidade de verdade em comunidade.","blind":"A mensagem só se torna transformação se Miguel realmente atravessar a conversa e assumir suas escolhas.","tags":["connection","honesty"]}],"teacher":"Todas têm valor e todas são incompletas isoladamente. Esse é o ponto da pegadinha."},{"time":"—","type":"summary","eyebrow":"O LAUDO FOI ABERTO","title":"Agora podemos interpretar as escolhas","teacher":"Agora, e somente agora, faça a leitura do curso e da Bíblia. Não trate o relatório como diagnóstico de personalidade."},{"time":"—","type":"reflection","eyebrow":"INVESTIGAÇÃO ENCERRADA","title":"Miguel não está nesta sala.","body":"<p class=\"lead\">Foi relativamente fácil enxergar os pontos cegos dele. Agora não pense no Miguel.</p>","quote":"O que grita dentro de você não precisa governar você.","teacher":"Dê silêncio. Ninguém precisa compartilhar. Feche com Gálatas 5:16 e oração."}];
let idx=0,selected=null;const trail=[];const tagCount={};
const app=document.getElementById('app'),clock=document.getElementById('clock'),progressBar=document.getElementById('progressBar'),teacherText=document.getElementById('teacherText');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextScene(){if(idx<scenes.length-1){idx++;render()}}
function pick(i,el){selected=i;document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');document.getElementById('confirmBtn').disabled=false}
function confirmChoice(){
 if(selected===null)return;
 const s=scenes[idx],o=s._renderedOptions[selected];
 trail.push({time:s.time,title:s.title,choice:o.t,good:o.good,blind:o.blind,tags:o.tags||[]});
 (o.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1);
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 const btn=document.getElementById('confirmBtn');btn.disabled=true;
 const box=document.getElementById('registered');
 box.innerHTML='<span class="tag">DECISÃO REGISTRADA</span><h3>Sem análise por enquanto.</h3><p class="lead" style="font-size:1.05rem">O que essa escolha revela — e onde está a pegadinha — só aparece no laudo final.</p><div class="actions"><button class="primary" onclick="nextScene()">Continuar</button></div>';
 box.classList.add('show');
}
function dominantPatterns(){
 const labels={performance:'desempenho como forma de recuperar controle ou valor',avoidance:'adiamento ou fuga do desconforto',regulation:'tentativas de reduzir a intensidade antes de agir',truth:'busca por fatos e clareza',clarification:'esclarecimento antes de concluir',validation:'busca por confirmação da própria leitura',rumination:'repetição mental do episódio',control:'necessidade de recuperar controle',distraction:'troca do desconforto por estímulo',connection:'movimento em direção a outras pessoas',comfort:'busca de conforto imediato',masking:'presença sem revelar o que está acontecendo',isolation:'recuo para enfrentar tudo sozinho',rest:'necessidade legítima de descanso',honesty:'abertura para admitir que algo não está bem',pause:'pausa antes de decidir',exposure:'permanência perto do estímulo',negotiation:'negociação com o limite',boundary:'mudança concreta de acesso ou ambiente',structure:'uso de estrutura e rotina'};
 return Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>'<div><b>'+esc(labels[k]||k)+'</b><span>'+v+' escolha'+(v>1?'s':'')+'</span></div>').join('');
}
function renderSummary(){
 const items=trail.map((x,i)=>'<div class="evidence" style="margin-top:14px"><div class="eyebrow">'+esc(x.time)+' · '+esc(x.title)+'</div><h3>'+esc(x.choice)+'</h3><p><strong>O que havia de legítimo:</strong> '+esc(x.good)+'</p><p><strong>O ponto cego possível:</strong> '+esc(x.blind)+'</p></div>').join('');
 return '<section class="scene active card"><div class="eyebrow">O LAUDO FOI ABERTO</div><h2>Agora podemos interpretar as escolhas</h2><p class="lead">A atividade não tinha uma letra secreta para acertar. Cada opção misturava algo compreensível, algo potencialmente útil e um risco que só aparece quando perguntamos <strong>o que aquela escolha estava tentando fazer pelo coração de Miguel</strong>.</p><div class="quote">A pegadinha era esta: comportamentos parecidos podem nascer de governos diferentes.</div><h3 style="margin-top:28px">Padrões mais presentes no caminho escolhido</h3><div class="lens">'+dominantPatterns()+'</div><h3 style="margin-top:30px">Leitura decisão por decisão</h3>'+items+'<div class="evidence"><div class="eyebrow">À LUZ DO CURSO</div><h3>FATO → INTERPRETAÇÃO → EMOÇÃO → DESEJO → IMPULSO → ESCOLHA → FRUTO</h3><p><strong>Aula 2:</strong> fato não é interpretação. <strong>Aula 3:</strong> a pergunta continua sendo “quem governa?”. <strong>Aulas 4 e 5:</strong> desejo e emoção podem ser reais sem se tornarem soberanos.</p></div><div class="evidence"><div class="eyebrow">À LUZ DA BÍBLIA</div><h3>Tiago 1:14–15 · 1 Coríntios 6:12 · Efésios 4:26–27 · Gálatas 5:16,22–25</h3><p><strong>Tiago:</strong> observe o processo do desejo até o fruto. <strong>1 Coríntios:</strong> a questão não é apenas “posso?”, mas “estou sendo dominado?”. <strong>Efésios:</strong> sentir raiva não é igual a entregar o governo à raiva. <strong>Gálatas:</strong> domínio próprio é fruto de uma vida que aprende a andar no Espírito.</p></div><div class="quote">Liberdade não é conseguir fazer tudo o que desejo. É não precisar obedecer a tudo o que desejo.</div><div class="actions"><button class="primary" onclick="nextScene()">Agora tire Miguel da sala</button></div></section>';
}
function render(){
 selected=null;const s=scenes[idx];clock.textContent=s.time;progressBar.style.width=((idx)/(scenes.length-1)*100)+'%';teacherText.innerHTML='<strong>'+esc(s.eyebrow||'')+'</strong><br>'+esc(s.teacher||'');
 if(s.type==='story'){
  app.innerHTML='<section class="scene active card"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="story">'+(s.body||'')+'</div>'+(s.quote?'<div class="quote">'+s.quote+'</div>':'')+(s.extra||'')+'<div class="actions"><button class="primary" onclick="nextScene()">Continuar</button></div></section>';
 } else if(s.type==='choice'){
  const opts=shuffle(s.options.map((o,i)=>({...o,orig:i})));s._renderedOptions=opts;
  app.innerHTML='<section class="scene active card"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="story">'+(s.body||'')+'</div><div class="question"><h3>'+s.question+'</h3><p class="note">Escolham a reação mais realista. Não tentem descobrir qual opção parece mais cristã.</p><div class="options">'+opts.map((o,i)=>'<button class="option" onclick="pick('+i+',this)">'+String.fromCharCode(65+i)+') '+o.t+'</button>').join('')+'</div></div><div class="actions"><button id="confirmBtn" class="primary" disabled onclick="confirmChoice()">Registrar decisão</button></div><div id="registered" class="reveal"></div></section>';
 } else if(s.type==='summary'){
  app.innerHTML=renderSummary();
 } else {
  app.innerHTML='<section class="scene active card center"><div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.title+'</h1>'+(s.body||'')+'<div class="quote">'+s.quote+'</div><div class="reflection" style="text-align:left"><label>Quando estou emocionalmente vulnerável, normalmente corro para…</label><textarea></textarea><label>A emoção que tenho mais dificuldade de enfrentar é…</label><textarea></textarea><label>O que eu costumo usar como alívio, controle ou anestesia é…</label><textarea></textarea><label>Antes da próxima pressão, preciso decidir…</label><textarea></textarea></div><p class="note">Essas respostas ficam apenas neste aparelho. Nada é enviado ou salvo.</p><div class="bigline">“Andai no Espírito.” <span style="color:var(--gold2)">Gálatas 5:16</span></div></section>';
 }
 window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('teacherBtn').addEventListener('click',()=>document.getElementById('teacherPanel').classList.toggle('show'));
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p'&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName))document.getElementById('teacherPanel').classList.toggle('show');if(e.key==='ArrowRight'&&scenes[idx].type==='story')nextScene()});
render();
</script>
