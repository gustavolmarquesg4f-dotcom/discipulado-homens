<title>Dossiê Miguel — Quando Algo Grita por Dentro</title>
<style>
:root{--bg:#07111f;--bg2:#101c2d;--paper:#f5efe4;--gold:#d7a953;--gold2:#f0d394;--ink:#f7f3ea;--muted:#aeb9c8;--line:rgba(255,255,255,.12);--card:rgba(10,21,36,.88);--shadow:0 24px 80px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 78% 18%,rgba(215,169,83,.10),transparent 28%),radial-gradient(circle at 18% 75%,rgba(58,104,164,.14),transparent 34%),linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:28px 28px}
.shell{max-width:1180px;margin:0 auto;padding:24px 24px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{letter-spacing:.18em;text-transform:uppercase;font-weight:800;font-size:.78rem;color:var(--gold2)}.clock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold2);border:1px solid rgba(215,169,83,.35);padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.18)}
.progress{height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:28px}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s ease}
.scene{display:none;animation:fade .45s ease}.scene.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--gold2);text-transform:uppercase;letter-spacing:.15em;font-weight:800;font-size:.8rem;margin-bottom:12px}h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0 0 16px;line-height:1.02}h1{font-size:clamp(2.7rem,6vw,6.2rem);max-width:980px}h2{font-size:clamp(2rem,4.2vw,4.5rem);max-width:1000px}h3{font-size:clamp(1.35rem,2.4vw,2.2rem)}.lead{font-size:clamp(1.05rem,2vw,1.45rem);line-height:1.65;color:#d9e0e9;max-width:930px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,42px);box-shadow:var(--shadow);backdrop-filter:blur(12px)}.story{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.15rem,2.2vw,1.55rem);line-height:1.7;color:#f5f1e9}.quote{margin:22px 0;padding:24px 28px;border-left:4px solid var(--gold);background:rgba(215,169,83,.07);font-family:Georgia,serif;font-size:clamp(1.25rem,2.6vw,2rem);line-height:1.45}
.question{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.option{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.035);color:var(--ink);text-align:left;padding:18px;border-radius:16px;font-size:1rem;line-height:1.45;cursor:pointer;transition:.2s ease;min-height:92px}.option:hover{transform:translateY(-2px);border-color:rgba(215,169,83,.55);background:rgba(215,169,83,.07)}.option.selected{border-color:var(--gold);background:rgba(215,169,83,.12);box-shadow:0 0 0 2px rgba(215,169,83,.10) inset}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button.primary,button.secondary{border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;font-size:.95rem}button.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b170e}button.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink)}button:disabled{opacity:.42;cursor:not-allowed}
.reveal{display:none;margin-top:24px;padding:24px;border-radius:18px;background:linear-gradient(145deg,rgba(215,169,83,.11),rgba(255,255,255,.03));border:1px solid rgba(215,169,83,.25)}.reveal.show{display:block;animation:fade .4s ease}.reveal .tag{display:inline-block;color:#1b170e;background:var(--gold2);font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:900;padding:6px 9px;border-radius:999px;margin-bottom:10px}
.evidence{margin-top:26px;padding:26px;border-radius:20px;background:var(--paper);color:#162132}.evidence .eyebrow{color:#8b6625}.evidence h3{color:#111b2a}.evidence p{font-size:1.05rem;line-height:1.6}.timeline{display:grid;gap:12px;margin:24px 0}.timeline .item{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}.timeline .time{font-weight:900;color:var(--gold2)}.choiceTrail{font-size:.98rem;color:#dbe1ea;line-height:1.55}
.lens{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.lens>div{padding:16px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.lens b{display:block;color:var(--gold2);margin-bottom:6px}
.reflection{display:grid;gap:14px;margin-top:24px}.reflection label{font-weight:700;color:var(--gold2)}.reflection textarea{width:100%;min-height:92px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);padding:14px;font:inherit;resize:vertical}.note{color:var(--muted);font-size:.9rem;line-height:1.5}.warning{padding:18px;border-left:4px solid var(--gold);background:rgba(215,169,83,.07);margin-top:18px}.bigline{font-family:Georgia,serif;font-size:clamp(1.9rem,4vw,4rem);line-height:1.08;margin:22px 0}.center{text-align:center}
.teacher-btn{position:fixed;right:18px;bottom:18px;z-index:50;width:42px;height:42px;border-radius:50%;border:1px solid rgba(215,169,83,.35);background:rgba(6,15,28,.88);color:var(--gold2);font-weight:900;cursor:pointer;box-shadow:var(--shadow)}.teacher-panel{display:none;position:fixed;right:72px;bottom:18px;z-index:50;width:min(430px,calc(100vw - 100px));max-height:62vh;overflow:auto;padding:18px;border-radius:18px;background:#0a1626;border:1px solid rgba(215,169,83,.35);box-shadow:var(--shadow)}.teacher-panel.show{display:block}.teacher-panel h4{margin:0 0 8px;color:var(--gold2)}.teacher-panel p{margin:.35rem 0 .8rem;color:#d8e0eb;line-height:1.5}
@media(max-width:760px){.options{grid-template-columns:1fr}.lens{grid-template-columns:1fr 1fr}.timeline .item{grid-template-columns:72px 1fr}.shell{padding:16px 16px 72px}}
</style>

<body>
<div class="shell">
<header><div class="brand">Homens de Verdade · Experiência Interativa</div><div class="clock" id="clock">17h40</div></header>
<div class="progress"><span id="progressBar"></span></div>
<main id="app"></main>
</div>
<button class="teacher-btn" id="teacherBtn" title="Notas do facilitador">P</button>
<div class="teacher-panel" id="teacherPanel"><h4>Notas do facilitador</h4><p id="teacherText"></p></div>
<script>
const scenes=[
{time:'17h40',type:'story',eyebrow:'ABERTURA',title:'DOSSIÊ MIGUEL',body:'<p>Miguel tem 30 anos. É cristão desde a adolescência, serve na igreja, trabalha bem e costuma ser visto como alguém responsável.</p><p>Hoje vocês não vão assistir a uma aula. Vão <strong>investigar um homem</strong>. A história será revelada aos poucos.</p>',quote:'No final, a pergunta não será apenas “o que Miguel fez?”, mas “o que estava governando Miguel?”',teacher:'Não explique Aula 4 e 5 aqui. Apenas estabeleça as regras: não diagnosticar rápido, não chamar toda emoção de pecado e não usar um versículo para encerrar a investigação.'},
{time:'17h40',type:'story',eyebrow:'DOSSIÊ 01',title:'A reunião',body:'<p>Durante uma reunião de trabalho, o gestor aponta um problema em um projeto conduzido por Miguel e diz diante da equipe:</p>',quote:'“Eu esperava uma condução melhor disso.”',extra:'<p>Miguel responde: “Tudo bem. Vou corrigir.” Depois da reunião, um colega pergunta se ele está bem.</p><div class="quote">“Estou tranquilo. Isso não me afeta.”</div>',teacher:'Pergunte apenas: “O que sabemos?”. Se alguém disser “ele foi humilhado” ou “ele ficou com raiva”, pergunte: fato ou interpretação? Não confirme nada ainda.'},
{time:'18h05',type:'story',eyebrow:'DOSSIÊ 02',title:'O que aconteceu por dentro',body:'<p>No carro, Miguel repassa a reunião mentalmente.</p>',quote:'“Ele fez isso para me diminuir.”<br>“Ninguém respeita o que eu faço.”<br>“Se eu não provar que sou bom, vão passar por cima de mim.”',extra:'<div class="warning"><strong>Agora a investigação muda.</strong><br>O fato continuou o mesmo. O que mudou foi o significado atribuído ao fato.</div>',evidence:{title:'EVIDÊNCIA 01 · AULA 2',text:'Fato e interpretação não são a mesma coisa. Uma situação externa pode acionar crenças antigas, produzir emoções e influenciar a próxima decisão.'},teacher:'Pergunte quais emoções poderiam aparecer a partir dessas interpretações. Não force uma emoção única.'},
{time:'20h10',type:'story',eyebrow:'DOSSIÊ 03',title:'A tentativa de aliviar',body:'<p>Miguel tinha combinado de encontrar alguns amigos da igreja. Cancela. Diz que está cansado.</p><p>Chega em casa, pede mais comida do que normalmente pediria e começa a alternar entre vídeos, redes sociais e conteúdo aleatório.</p>',quote:'“Todo mundo está avançando e eu estou ficando para trás.”',extra:'<p>Uma hora passa. Depois duas. O problema do trabalho não foi resolvido. A sensação dentro dele também não.</p>',teacher:'Pergunte: “O que Miguel está tentando conseguir?”. Se responderem prazer, avance: “e por que ele precisa disso agora?”. Leve-os a alívio, anestesia, validação, controle, recompensa.'},
{time:'23h34',type:'story',eyebrow:'DOSSIÊ 04',title:'A negociação',body:'<p>Continuando no celular, Miguel encontra conteúdo sensual. Fecha. Alguns minutos depois, volta.</p>',quote:'“Só vou olhar.”<br>“Eu já estou mal mesmo.”<br>“É só hoje.”<br>“Amanhã eu recomeço.”',extra:'<p>Ele termina consumindo pornografia. Às 00h17 fecha o celular e pensa: “Sou muito fraco. Deus deve estar cansado de mim.”</p>',evidence:{title:'PERGUNTA DO CASO',text:'Onde Miguel caiu? Às 23h34? Às 20h10? Às 18h05? Não procure um único ponto: investigue a cadeia.'},teacher:'Deixe-os discutir onde a queda começou. Depois mostre que não existe só um ponto: fato → interpretação → emoção → desejo de alívio → rota de fuga → negociação → escolha → fruto.'},
{time:'00h17',type:'story',eyebrow:'MAPA DO CASO',title:'O comportamento foi o último capítulo',body:'<div class="timeline"><div class="item"><div class="time">17h40</div><div>Crítica pública</div></div><div class="item"><div class="time">18h05</div><div>“Estão diminuindo meu valor”</div></div><div class="item"><div class="time">20h10</div><div>Isolamento, comparação, busca de alívio</div></div><div class="item"><div class="time">23h34</div><div>Negociação interna</div></div><div class="item"><div class="time">00h17</div><div>Prazer breve → culpa → vergonha → isolamento</div></div></div>',quote:'Contexto explica comportamento. Não elimina responsabilidade. Responsabilidade não exige ignorar contexto.',teacher:'Faça a pergunta “vítima ou responsável?”. Não aceite resposta simplista. Depois avance para a reconstrução.'},

{time:'17h40',type:'choice',eyebrow:'ATIVIDADE · VOLTE NO TEMPO',title:'Vocês assumem o caso',body:'<p>Agora Miguel volta para o instante imediatamente posterior à reunião.</p><p>Escolham o que vocês realmente recomendariam. Defendam a escolha antes de clicar.</p>',question:'Miguel acabou de sair da reunião. O que ele faz nos próximos minutos?',options:[
{t:'Decide não responder no calor do momento, anota o que ouviu e segue o restante do expediente.',consequence:'A escolha reduz o risco de reação impulsiva. Mas silêncio não revela, por si só, se houve domínio próprio, medo ou repressão. O conflito interior pode apenas ter sido adiado.',lens:'Uma boa ação externa não revela automaticamente uma boa motivação.',verse:'Efésios 4:26–27'},
{t:'Procura o gestor logo após a reunião e pergunta, em particular, o que exatamente ele esperava diferente.',consequence:'A escolha cria espaço para clareza. Mas, se Miguel estiver tentando provar que a crítica foi injusta, até uma conversa madura pode virar defesa sofisticada.',lens:'A mesma conversa pode nascer de humildade ou de necessidade de se justificar.',verse:'Provérbios 18:13; Tiago 1:19'},
{t:'Faz uma oração curta antes de qualquer conversa e pede para Deus tirar dele a raiva.',consequence:'Orar é bom. A pegadinha é outra: Miguel pode estar usando a oração apenas para não sentir. A pergunta é se apresentará a Deus o coração inteiro ou apenas tentará desligar a emoção.',lens:'Espiritualidade também pode ser usada como fuga quando substitui honestidade.',verse:'Salmo 139:23–24'},
{t:'Revê mentalmente toda a reunião para decidir se a crítica foi justa antes de fazer qualquer coisa.',consequence:'Refletir pode ser sábio. Ruminar, porém, é diferente de refletir. Quanto mais Miguel repete a cena procurando confirmação de que foi desrespeitado, mais sua interpretação ganha força.',lens:'Pensar sobre algo não é o mesmo que discerni-lo.',verse:'Romanos 12:2'}],teacher:'As opções são deliberadamente ambíguas. Depois da escolha, pergunte: “O que essa ação protege? O que ela deixa sem resposta?”.'},

{time:'18h20',type:'choice',eyebrow:'DECISÃO 02',title:'Agora ele percebe a raiva',body:'<p>Miguel sente o corpo tenso. Ele sabe que algo o afetou, mas ainda não sabe exatamente o quê.</p>',question:'Qual seria a próxima resposta mais madura?',options:[
{t:'Liga para um amigo de confiança e conta exatamente como o chefe foi injusto.',consequence:'Comunidade é importante. Mas contar “exatamente como o chefe foi injusto” já pressupõe que a interpretação de Miguel é fato. O amigo pode virar apenas uma testemunha da narrativa dele.',lens:'Pedir ajuda não garante que estamos buscando verdade; às vezes buscamos validação.',verse:'Provérbios 12:15'},
{t:'Faz uma nota privada separando três colunas: o que foi dito, o que ele concluiu e o que sentiu.',consequence:'Essa escolha cria espaço entre fato, interpretação e emoção. Ainda não resolve o problema, mas aumenta consciência e reduz a mistura entre o que aconteceu e o que Miguel imaginou.',lens:'Nomear com precisão diminui a força da confusão.',verse:'Romanos 12:2'},
{t:'Decide que, como cristão, não deveria sentir raiva e tenta mudar o foco imediatamente.',consequence:'Parece espiritual, mas transforma maturidade em supressão. A Bíblia não trata toda raiva como pecado automático; confronta o que fazemos com ela.',lens:'Sentir não é o mesmo que pecar. Sentir também não é obedecer ao sentimento.',verse:'Efésios 4:26'},
{t:'Espera a emoção baixar sozinha antes de olhar para o assunto novamente.',consequence:'Às vezes esperar ajuda. Mas emoção que perde intensidade não significa emoção compreendida. O padrão pode retornar na próxima crítica.',lens:'Tempo pode acalmar; não necessariamente transforma.',verse:'Salmo 42'}],teacher:'Se escolherem a ligação, pergunte: “Ele quer verdade ou confirmação?”. Se escolherem supressão, pergunte: “Deus quer apenas tirar a emoção ou também revelar o que ela expõe?”.'},

{time:'20h10',type:'choice',eyebrow:'DECISÃO 03',title:'O encontro com os amigos',body:'<p>Miguel havia combinado de encontrar alguns homens da igreja. Está sem vontade de ir.</p>',question:'O que ele deveria fazer?',options:[
{t:'Vai normalmente. Não comenta nada para não transformar o encontro em sessão de problemas.',consequence:'Ele não se isolou fisicamente. Ri, conversa e participa. Volta para casa ainda com o mesmo conflito. Ninguém percebe.',lens:'Estar acompanhado não é o mesmo que ser conhecido.',verse:'Gálatas 6:2'},
{t:'Cancela, porque precisa descansar e organizar a cabeça antes de falar com alguém.',consequence:'Descanso pode ser necessário. Mas “preciso ficar sozinho para organizar a cabeça” também pode se tornar uma justificativa respeitável para isolamento.',lens:'Nem toda solitude é isolamento; nem todo isolamento parece isolamento.',verse:'Eclesiastes 4:9–10'},
{t:'Vai ao encontro e diz a um deles apenas: “Hoje eu não estou legal. Depois posso falar com você?”',consequence:'Miguel não expõe tudo, mas rompe a aparência de que está bem e cria uma ponte para conversa. Ainda existe uma escolha futura: atravessar ou não essa ponte.',lens:'Vulnerabilidade pode começar pequena e ainda assim ser verdadeira.',verse:'Tiago 5:16'},
{t:'Manda uma mensagem dizendo que prefere ficar em casa para orar e evitar falar algo que não deve.',consequence:'A justificativa é espiritual e pode até ser prudente. Mas também pode permitir que Miguel permaneça sozinho com a mesma interpretação, a mesma raiva e o mesmo acesso às rotas de fuga.',lens:'Uma decisão pode ser espiritualmente bem formulada e ainda assim esconder evasão.',verse:'Provérbios 18:1'}],teacher:'A pegadinha forte aqui é “estar entre homens” versus “ser conhecido por homens”.'},

{time:'21h17',type:'choice',eyebrow:'DECISÃO 04',title:'A rota de alívio',body:'<p>Miguel chegou em casa. O conflito continua. Ele quer desligar a cabeça.</p>',question:'Qual destas escolhas parece mais segura agora?',options:[
{t:'Coloca uma pregação no celular para trocar o conteúdo da mente.',consequence:'Cinco minutos depois ele responde uma mensagem, abre outra aba e volta a navegar. O conteúdo era bom; a estrutura de fuga continuou a mesma.',lens:'Conteúdo cristão não transforma automaticamente a forma como usamos uma ferramenta.',verse:'Tiago 1:22'},
{t:'Abre o notebook e adianta trabalho para recuperar a sensação de competência.',consequence:'Ele produz bastante. Também reforça a ideia de que precisa provar valor para recuperar paz. Um comportamento socialmente admirado pode servir à mesma necessidade de anestesia.',lens:'Nem toda fuga parece descontrole. Algumas parecem produtividade.',verse:'Salmo 127:2'},
{t:'Pede comida, assiste a uma série e decide que pensará nisso amanhã.',consequence:'Não há pecado automático em comer ou assistir algo. A pergunta é funcional: o que Miguel está pedindo que essas coisas façam por ele agora?',lens:'A questão não é só “o que faço?”, mas “o que espero que isso faça por mim?”.',verse:'1 Coríntios 6:12'},
{t:'Deixa o celular longe por alguns minutos, toma banho, caminha e só depois volta ao problema.',consequence:'Mudar o estado físico pode reduzir a pressão e criar espaço para pensar. Mas isso ainda não substitui verdade, conversa, arrependimento ou limite quando forem necessários.',lens:'Regular-se não é resolver tudo; é criar espaço para escolher melhor.',verse:'1 Reis 19:5–8'}],teacher:'Não trate comida, série, trabalho ou celular como moralmente equivalentes. O ponto é a função de alívio/anestesia.'},

{time:'23h34',type:'choice',eyebrow:'DECISÃO 05',title:'A encruzilhada',body:'<p>Surge conteúdo sensual. Miguel percebe que está vulnerável.</p>',question:'O que ele faz agora?',options:[
{t:'Fecha o conteúdo imediatamente e continua usando o celular normalmente.',consequence:'Ele recusou o conteúdo, mas manteve o ambiente, o cansaço, o isolamento, a disponibilidade e a busca de alívio exatamente como estavam.',lens:'Remover o estímulo não é o mesmo que mudar a estrutura da tentação.',verse:'2 Timóteo 2:22'},
{t:'Faz uma oração firme, pede força e continua onde está até a vontade passar.',consequence:'A oração é real. Mas “ficar onde está até passar” pode transformar fé em teste desnecessário de resistência. A Escritura também fala em fugir.',lens:'Dependência do Espírito não elimina decisões concretas de ambiente e limite.',verse:'2 Timóteo 2:22'},
{t:'Troca para conteúdo cristão e decide ocupar a mente com algo melhor.',consequence:'Isso pode ajudar, mas o telefone continua na mão e a noite continua sendo regulada por troca de estímulo. A raiz não desapareceu porque o algoritmo mudou.',lens:'Substituição de conteúdo pode ser útil; não é sinônimo de transformação.',verse:'Filipenses 4:8'},
{t:'Vai para outro cômodo, deixa o telefone carregando longe e manda a alguém: “Você está acordado?”',consequence:'Essa escolha não garante vitória automática. Ela muda três coisas ao mesmo tempo: ambiente, acesso e isolamento. A pressão continua, mas deixa de ser combatida no mesmo terreno.',lens:'Maturidade frequentemente combina oração, limite, movimento e comunidade.',verse:'2 Timóteo 2:22; Gálatas 6:2'}],teacher:'Não diga “D é a certa”. Pergunte por que as outras três, embora pareçam boas, ainda deixam elementos importantes intactos.'},

{time:'23h52',type:'choice',eyebrow:'DECISÃO 06',title:'A vitória aparente',body:'<p>Suponha que Miguel NÃO tenha consumido pornografia nesta noite.</p><p>Ele fechou o conteúdo. Agora está deitado.</p>',question:'Podemos dizer que o problema foi resolvido?',options:[
{t:'Sim. O objetivo principal era não cair, e ele conseguiu.',consequence:'Evitar o ato importa. Mas Miguel pode continuar governado por aprovação, raiva, vergonha e isolamento. O comportamento final não é a única coisa que Deus forma.',lens:'Santidade não é apenas ausência do ato visível.',verse:'Mateus 5:21–30'},
{t:'Ainda não. Amanhã ele precisa identificar por que ficou tão vulnerável e conversar com alguém.',consequence:'Essa resposta amplia a investigação. Mesmo assim, entender a raiz não substitui decisões concretas de obediência e limite.',lens:'Autoconhecimento sem obediência também pode virar fuga.',verse:'Tiago 1:22'},
{t:'Sim, desde que ele agradeça a Deus e fortaleça sua vida devocional amanhã.',consequence:'Gratidão e devoção são essenciais. Mas podem virar uma solução genérica se Miguel nunca enfrentar o conflito, a solidão, a interpretação e os padrões de acesso.',lens:'Práticas espirituais não são atalhos para evitar verdade.',verse:'Salmo 51:6'},
{t:'Não dá para responder ainda. Precisamos saber quem está governando as próximas escolhas de Miguel.',consequence:'Essa resposta desloca o foco do episódio para o governo do coração. Ainda assim, ela exige que essa reflexão se torne prática concreta.',lens:'A pergunta central do curso retorna: quem governa?',verse:'Gálatas 5:16,22–25'}],teacher:'Mostre que “não caiu” pode ser vitória real, mas não necessariamente maturidade completa.'},

{time:'00h17',type:'story',eyebrow:'ARQUIVO CONFIDENCIAL',title:'O que ninguém viu',body:'<p>Miguel já vinha dormindo mal havia algumas semanas.</p><p>Seu pai valorizava muito desempenho. Na infância, Miguel ouviu muitas vezes: “Você consegue fazer melhor”. Aos poucos, correção começou a soar como “você ainda não é suficiente”.</p><p>Nos últimos meses ele também começou a sentir solidão ao ver amigos namorando, casando e avançando em outras áreas da vida.</p>',quote:'Novas evidências mudam nossa compreensão. Não apagam nossa responsabilidade.',evidence:{title:'AULA 4 + 5',text:'Muitas vezes o homem usa um apetite para regular uma emoção: busca prazer, produtividade, comida, tela ou sexualidade para não permanecer diante de vergonha, solidão, medo, raiva ou frustração.'},teacher:'Pergunte: “Isso muda o veredito?”. Muda compreensão, não torna a escolha inevitável.'},
{time:'00h17',type:'story',eyebrow:'EVIDÊNCIAS BÍBLICAS',title:'Agora investigue os textos',body:'<div class="lens"><div><b>Tiago 1:14–15</b>Desejo, atração, desenvolvimento e fruto.</div><div><b>1 Coríntios 6:12</b>A pergunta não é apenas “posso?”, mas “isso me domina?”.</div><div><b>Efésios 4:26–27</b>Sentir raiva não é idêntico a pecar; o que fazemos com ela importa.</div><div><b>Gálatas 5:16,22–25</b>Andar no Espírito inclui domínio próprio e uma nova forma de viver.</div></div>',quote:'O desejo pode ser real sem ser soberano. A emoção também pode ser real sem ser soberana.',teacher:'Leia os textos juntos. Faça três perguntas: O que o texto diz? O que não diz? Como confronta Miguel?'},
{time:'00h17',type:'summary',eyebrow:'RECONSTRUÇÃO',title:'A trajetória que vocês escolheram',body:'',teacher:'Leia o caminho em voz alta. Pergunte: “Se pudessem alterar apenas UMA decisão, qual seria?”.'},
{time:'—',type:'reflection',eyebrow:'INVESTIGAÇÃO ENCERRADA',title:'Miguel não está nesta sala.',body:'<p class="lead">Foi relativamente fácil enxergar os pontos cegos dele. Agora não pense no Miguel.</p>',quote:'O que grita dentro de você não precisa governar você.',teacher:'Dê silêncio. Ninguém precisa compartilhar as respostas. Feche com Gálatas 5:16 e oração.'}

let idx=0,selected=null;const trail=[];const app=document.getElementById('app'),clock=document.getElementById('clock'),progressBar=document.getElementById('progressBar'),teacherText=document.getElementById('teacherText');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){selected=null;const s=scenes[idx];clock.textContent=s.time;progressBar.style.width=((idx)/(scenes.length-1)*100)+'%';teacherText.innerHTML='<strong>'+esc(s.eyebrow||'')+'</strong><br>'+esc(s.teacher||'');
if(s.type==='story'){app.innerHTML='<section class="scene active card"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="story">'+(s.body||'')+'</div>'+(s.quote?'<div class="quote">'+s.quote+'</div>':'')+(s.extra||'')+(s.evidence?'<div class="evidence"><div class="eyebrow">'+s.evidence.title+'</div><h3>'+s.evidence.text+'</h3></div>':'')+'<div class="actions"><button class="primary" onclick="nextScene()">Continuar</button></div></section>'}
else if(s.type==='choice'){const opts=shuffle(s.options.map((o,i)=>({...o,orig:i})));s._renderedOptions=opts;app.innerHTML='<section class="scene active card"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="story">'+(s.body||'')+'</div><div class="question"><h3>'+s.question+'</h3><p class="note">Discutam antes de clicar. Não há alternativa marcada como “certa”.</p><div class="options" id="opts">'+opts.map((o,i)=>'<button class="option" onclick="pick('+i+',this)">'+String.fromCharCode(65+i)+') '+o.t+'</button>').join('')+'</div></div><div class="actions"><button id="revealBtn" class="primary" disabled onclick="revealChoice()">Revelar consequência</button></div><div id="reveal" class="reveal"></div></section>'}
else if(s.type==='summary'){app.innerHTML='<section class="scene active card"><div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="timeline">'+trail.map(x=>'<div class="item"><div class="time">'+esc(x.time)+'</div><div class="choiceTrail"><strong>'+esc(x.title)+'</strong><br>'+esc(x.choice)+'</div></div>').join('')+'</div><div class="quote">Se vocês pudessem voltar e alterar apenas UMA decisão, qual seria?</div><div class="actions"><button class="primary" onclick="nextScene()">Encerrar investigação</button></div></section>'}
else{app.innerHTML='<section class="scene active card center"><div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.title+'</h1>'+(s.body||'')+'<div class="quote">'+s.quote+'</div><div class="reflection" style="text-align:left"><label>Quando estou emocionalmente vulnerável, normalmente corro para…</label><textarea></textarea><label>A emoção que tenho mais dificuldade de enfrentar é…</label><textarea></textarea><label>O que eu costumo usar como alívio ou anestesia é…</label><textarea></textarea><label>Antes da próxima pressão, preciso decidir…</label><textarea></textarea></div><p class="note">Essas respostas ficam apenas neste aparelho. Nada é enviado ou salvo.</p><div class="bigline">“Andai no Espírito.” <span style="color:var(--gold2)">Gálatas 5:16</span></div></section>'}
window.scrollTo({top:0,behavior:'smooth'})}
function pick(i,el){selected=i;document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');document.getElementById('revealBtn').disabled=false}
function revealChoice(){if(selected===null)return;const s=scenes[idx],o=s._renderedOptions[selected];trail.push({time:s.time,title:s.title,choice:o.t});const r=document.getElementById('reveal');r.innerHTML='<span class="tag">O que essa escolha revela</span><h3>'+o.consequence+'</h3><p class="lead" style="font-size:1.08rem"><strong>Lente:</strong> '+o.lens+'</p><div class="evidence"><div class="eyebrow">À LUZ DA BÍBLIA</div><h3>'+o.verse+'</h3><p>Não use o texto como resposta automática. Pergunte: o que ele confronta na escolha? O que ele não permite concluir?</p></div><div class="actions"><button class="primary" onclick="nextScene()">Avançar no caso</button></div>';r.classList.add('show');document.getElementById('revealBtn').disabled=true;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}
function nextScene(){if(idx<scenes.length-1){idx++;render()}}
document.getElementById('teacherBtn').addEventListener('click',()=>document.getElementById('teacherPanel').classList.toggle('show'));
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p'&&!['TEXTAREA','INPUT'].includes(document.activeElement.tagName))document.getElementById('teacherPanel').classList.toggle('show');if(e.key==='ArrowRight'&&scenes[idx].type==='story')nextScene()});
render();
</script>
</body>
